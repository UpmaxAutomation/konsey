[project]
name = "llm-council"
version = "0.2.0"
description = "LLM Council - Multi-model deliberation system"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Core FastAPI
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.0.0",
    "python-multipart>=0.0.21",
    # Database
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    # Authentication
    "python-jose[cryptography]>=3.3.0",
    "passlib[argon2]>=1.7.4",
    "authlib>=1.3.0",
    "cryptography>=42.0.0",
    # Email (optional, for verification)
    "aiosmtplib>=3.0.0",
    # Logging & Observability
    "structlog>=24.1.0",
    "python-json-logger>=2.0.0",
    # Rate Limiting
    "slowapi>=0.1.9",
    # Metrics (optional)
    "prometheus-client>=0.19.0",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "respx>=0.21.0",
    "factory-boy>=3.3.0",
    "aiohttp>=3.9.0",
    "email-validator>=2.1.0",
    "redis>=5.0.0",
    # Linting & Type Checking
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    # Pre-commit
    "pre-commit>=3.6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --cov=backend --cov-report=html --cov-report=term-missing"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["backend"]
omit = ["tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
fail_under = 50

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
