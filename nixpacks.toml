# Nixpacks configuration - ensure Python + pip, use pip directly
[phases.setup]
nixPkgs = ["python311", "python311Packages.pip", "python311Packages.setuptools"]

[phases.install]
cmds = ["pip install -r requirements.txt"]

[phases.build]
cmds = ["echo 'Skipping build phase'"]

[start]
cmd = "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"

[variables]
NIXPACKS_NO_INSTALL_UV = "1"
