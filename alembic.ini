# Alembic configuration for LLM Council

[alembic]
# Path to migration scripts
script_location = backend/database/migrations

# Template used to generate migration file names
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Don't truncate output
truncate_slug_length = 40

# Prepend UTC timestamp to migration revision
prepend_sys_path = .

# Timezone to use for output
timezone = UTC

# Output encoding
output_encoding = utf-8

# Database URL - set via environment variable
sqlalchemy.url = postgresql+asyncpg://council:council@localhost:5432/llm_council

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
