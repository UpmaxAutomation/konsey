version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: llm_council_db
    environment:
      POSTGRES_USER: ${DB_USER:-council}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-council}
      POSTGRES_DB: ${DB_NAME:-llm_council}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-council} -d ${DB_NAME:-llm_council}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - llm_council_net

  # Backend API
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: llm_council_api
    environment:
      - DATABASE_URL=postgresql+asyncpg://${DB_USER:-council}:${DB_PASSWORD:-council}@postgres:5432/${DB_NAME:-llm_council}
      - SECRET_KEY=${SECRET_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      - REFRESH_TOKEN_EXPIRE_DAYS=${REFRESH_TOKEN_EXPIRE_DAYS:-30}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads_data:/app/data/uploads
    restart: unless-stopped
    networks:
      - llm_council_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-/api}
        - VITE_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
    container_name: llm_council_frontend
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - llm_council_net

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: llm_council_proxy
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      - llm_council_net

  # Optional: Cloudflare Tunnel (uncomment to enable)
  # cloudflared:
  #   image: cloudflare/cloudflared:latest
  #   container_name: llm_council_tunnel
  #   command: tunnel --no-autoupdate run
  #   environment:
  #     - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
  #   restart: unless-stopped
  #   networks:
  #     - llm_council_net
  #   depends_on:
  #     - nginx

volumes:
  postgres_data:
  uploads_data:

networks:
  llm_council_net:
    driver: bridge
